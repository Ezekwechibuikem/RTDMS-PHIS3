{% extends "account-base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <h3>Forgot Password</h3>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary w-100">
                    Send OTP
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
